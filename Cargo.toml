[package]
name = "cairn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
fastcdc = "5.0.0"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ignore = "0.4.33"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
flate2 = "1.1.10"
